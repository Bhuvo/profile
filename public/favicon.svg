<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#080812"/>
  <rect x="2" y="2" width="96" height="96" rx="22" fill="none" stroke="url(#glowGrad)" stroke-width="2" stroke-opacity="0.4"/>
  <!-- Neural hexagon / diamond node -->
  <polygon points="50,18 78,34 78,66 50,82 22,66 22,34" fill="none" stroke="url(#glowGrad)" stroke-width="3" filter="url(#glow)"/>
  <!-- Central core -->
  <circle cx="50" cy="50" r="10" fill="url(#glowGrad)" filter="url(#glow)"/>
  <path d="M50 20 L50 40 M50 60 L50 80 M24 35 L42 45 M58 55 L76 65 M24 65 L42 55 M58 45 L76 35" stroke="#22D3EE" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.8"/>
  <circle cx="50" cy="20" r="3.5" fill="#22D3EE"/>
  <circle cx="78" cy="34" r="3.5" fill="#8B5CF6"/>
  <circle cx="78" cy="66" r="3.5" fill="#6366F1"/>
  <circle cx="50" cy="82" r="3.5" fill="#22D3EE"/>
  <circle cx="22" cy="66" r="3.5" fill="#8B5CF6"/>
  <circle cx="22" cy="34" r="3.5" fill="#6366F1"/>
</svg>
